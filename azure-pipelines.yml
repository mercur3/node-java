trigger:
  - master
pr:
  autoCancel: true
  branches:
    include:
      - master
pool:
  vmImage: ubuntu-latest
jobs:
  - job:
    displayName: Building image on Fedora 43, Java 25
    pool:
      vmImage: ubuntu-latest
    steps:
      - script: |
          echo "Building the images"
          printf "Using %d threads\n" $(nproc)
          echo "------------------------------------------------------\n"
          sed "s/__src_tag_name__/fedora:43/g" -i Dockerfile
          sed "s/__java_version__/25/g" -i Dockerfile
          cat Dockerfile
        displayName: Adding the version

      - task: Docker@2
        displayName: Build & Push Node‐Java Image
        condition: not(eq(variables['Build.Reason'], 'PullRequest'))
        inputs:
          command: buildAndPush
          containerRegistry: docker-hub-login
          repository: mercur3/node-java
          Dockerfile: Dockerfile
          tags: |
            fedora43-java25
            latest


